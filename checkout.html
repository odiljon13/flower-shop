<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Shop.co</title>
    <link rel="icon" href="img/logo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
    body { font-family: 'Inter', sans-serif; }
    .toast { position: fixed; top: 1rem; right: 1rem; background-color: #ec4899; color: white; padding: 0.75rem 1.25rem; border-radius: 0.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transform: translateY(-100px); opacity: 0; transition: all 0.5s ease; z-index: 9999; }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body class="bg-pink-50">

<!-- Navbar -->
<nav class="bg-white shadow p-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-2">
        <img src="img/logo.jpg" alt="Logo" class="w-8 h-8 rounded-full shadow object-cover">
        <h1 class="text-2xl font-bold text-pink-600">Shop.co</h1>
    </div>
    <a href="index.html" class="bg-pink-500 text-white px-4 py-2 rounded-full hover:bg-pink-600 transition">Back to Shop</a>
</nav>

<!-- Checkout Form -->
<main class="max-w-4xl mx-auto p-8 bg-white shadow-xl mt-8 rounded-xl">
    <h2 class="text-3xl font-bold mb-6 text-pink-600">Checkout 🌸</h2>

    <!-- Cart Items -->
    <ul id="checkout-items" class="space-y-4 border p-4 rounded-lg bg-pink-50"></ul>
    <p id="checkout-total" class="font-bold mt-4 text-lg text-pink-700">Total: $0</p>

    <!-- Form -->
    <form id="checkout-form" class="space-y-4 mt-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" id="customerName" placeholder="Ism va Familiya" class="border p-3 rounded-lg focus:ring-2 focus:ring-pink-500 focus:outline-none" required>
            <input type="tel" id="customerPhone" placeholder="Telefon raqami" value="+998" pattern="^\+998[0-9]{9}$" title="Telefon raqami +998 bilan boshlanishi va jami 13 ta belgidan iborat bo'lishi kerak" maxlength="13" class="border p-3 rounded-lg focus:ring-2 focus:ring-pink-500 focus:outline-none" required>
            <input type="text" id="customerAddress" placeholder="Manzil (Shahar, tuman, ko'cha)" class="border p-3 rounded-lg focus:ring-2 focus:ring-pink-500 focus:outline-none md:col-span-2" required>
            <select id="paymentMethod" class="border p-3 rounded-lg focus:ring-2 focus:ring-pink-500 focus:outline-none md:col-span-2">
                <option value="cash">Naqd pul orqali (Yetkazib berilganda)</option>
                <option value="card">Plastik karta orqali</option>
            </select>
            
            <!-- Card Details Box (Premium UI) -->
            <div id="card-details-box" class="hidden md:col-span-2 mt-2 border border-gray-200 p-5 md:p-8 rounded-2xl bg-white shadow-sm">
                <!-- Virtual Card -->
                <div class="bg-gradient-to-br from-indigo-900 via-purple-700 to-indigo-600 rounded-2xl p-6 text-white shadow-2xl relative overflow-hidden mb-8">
                    <!-- Decorative Circles -->
                    <div class="absolute top-0 right-0 -mr-8 -mt-8 w-40 h-40 rounded-full bg-white opacity-10 blur-2xl"></div>
                    <div class="absolute bottom-0 left-0 -ml-8 -mb-8 w-32 h-32 rounded-full bg-pink-400 opacity-20 blur-xl"></div>
                    
                    <div class="flex justify-between items-center mb-6 relative z-10">
                        <div class="flex items-center gap-2">
                            <div class="w-10 h-6 bg-gradient-to-r from-yellow-300 to-yellow-500 rounded-sm opacity-90"></div>
                            <span class="font-bold text-sm tracking-widest text-white/90">HUMO / UZCARD / VISA</span>
                        </div>
                        <span class="text-xs font-bold opacity-80 tracking-wider">BANK CARD</span>
                    </div>
                    <div class="text-2xl md:text-3xl font-mono tracking-widest mb-6 relative z-10 drop-shadow-md">
                        5614 6820 6022 1316
                    </div>
                    <div class="flex justify-between items-end relative z-10">
                        <div>
                            <p class="text-[10px] opacity-70 uppercase tracking-widest mb-1">KARTA EGASI</p>
                            <p class="font-bold text-sm md:text-base tracking-widest uppercase text-white/95">ODILJON DILSHODBEKOV</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] opacity-70 uppercase tracking-widest mb-1">AMAL QILADI</p>
                            <p class="font-bold text-sm tracking-widest">12/28</p>
                        </div>
                    </div>
                </div>

                <!-- Payment Form Fields -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-500 font-medium mb-1">Karta raqami</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                                💳
                            </div>
                            <input type="text" id="payCardNum" placeholder="8600 0000 0000 0000" maxlength="19" class="w-full pl-10 pr-3 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 outline-none font-mono text-gray-700 transition">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-500 font-medium mb-1">GG/YY</label>
                            <input type="text" id="payCardExp" placeholder="12/28" maxlength="5" class="w-full px-3 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 outline-none text-gray-700 transition">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 font-medium mb-1">CVC/CVP</label>
                            <input type="password" id="payCardCvc" placeholder="•••" maxlength="3" class="w-full px-3 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 outline-none text-gray-700 transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 font-medium mb-1">Karta egasining ism-familiyasi</label>
                        <input type="text" id="payCardName" placeholder="Ism va Familiya" class="w-full px-3 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 outline-none text-gray-700 transition">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="flex gap-4 pt-4">
            <a href="index.html" class="w-1/3 bg-white border-2 border-gray-200 text-gray-600 font-bold py-3 rounded-xl hover:bg-gray-50 transition text-center flex items-center justify-center">
                Bekor qilish
            </a>
            <button type="submit" class="w-2/3 bg-gradient-to-r from-purple-600 to-blue-500 text-white font-bold py-3 rounded-xl hover:opacity-90 transition transform active:scale-95 shadow-lg">
                Tasdiqlash va to'lash
            </button>
        </div>
    </form>
</main>

<!-- Footer -->
<footer class="bg-white shadow text-center p-6 mt-12 rounded-t-xl">
    <p class="text-gray-600">© 2025 Shop.co. All rights reserved.</p>
</footer>

<script>

const checkoutItemsEl = document.getElementById("checkout-items");
const checkoutTotalEl = document.getElementById("checkout-total");
const cart = JSON.parse(localStorage.getItem("cart")) || [];
let total = 0;

if(cart.length === 0){
  checkoutItemsEl.innerHTML = "<p class='text-gray-500'>Your cart is empty 😢</p>";
}

cart.forEach(item => {
  const li = document.createElement("li");
  li.className = "flex justify-between items-center border-b pb-2";
  li.innerHTML = `
    <div class="flex items-center space-x-4">
      <img src="${item.img}" alt="${item.name}" class="w-16 h-16 object-cover rounded-lg shadow">
      <div>
        <p class="font-semibold text-pink-600">${item.name}</p>
        <p class="text-gray-700">$${item.price} x ${item.quantity}</p>
      </div>
    </div>
    <p class="font-bold text-pink-700">$${item.price * item.quantity}</p>
  `;
  checkoutItemsEl.appendChild(li);
  total += item.price * item.quantity;
});

checkoutTotalEl.textContent = `Total: $${total}`;

// Payment method listener
const paymentMethodSelect = document.getElementById("paymentMethod");
const cardDetailsBox = document.getElementById("card-details-box");

paymentMethodSelect.addEventListener("change", function() {
    if (this.value === "card") {
        cardDetailsBox.classList.remove("hidden");
    } else {
        cardDetailsBox.classList.add("hidden");
    }
});

document.getElementById("checkout-form").addEventListener("submit", async function(e) {
  e.preventDefault();
  
  const name = document.getElementById("customerName").value;
  const phone = document.getElementById("customerPhone").value;
  const address = document.getElementById("customerAddress").value;
  const method = document.getElementById("paymentMethod").options[document.getElementById("paymentMethod").selectedIndex].text;
  
  const token = localStorage.getItem("tgBotToken");
  const chatId = localStorage.getItem("tgChatId");
  
  const submitBtn = document.querySelector('button[type="submit"]');
  const originalText = submitBtn.textContent;
  submitBtn.textContent = 'Yuborilmoqda...';
  submitBtn.disabled = true;
  
  if (token && chatId) {
      let message = `🛒 <b>YANGI BUYURTMA</b>\n\n`;
      message += `👤 <b>Xaridor:</b> ${name}\n`;
      message += `📞 <b>Telefon:</b> ${phone}\n`;
      message += `📍 <b>Manzil:</b> ${address}\n`;
      message += `💳 <b>To'lov turi:</b> ${method}\n\n`;
      message += `🛍️ <b>Gullar:</b>\n`;
      
      cart.forEach(item => {
          message += `- ${item.name} (${item.quantity} x $${item.price}) = $${item.price * item.quantity}\n`;
      });
      message += `\n💰 <b>Jami summa:</b> $${total}`;
      
      const url = `https://api.telegram.org/bot${token}/sendMessage`;
      
      try {
          await fetch(url, {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                  chat_id: chatId,
                  text: message,
                  parse_mode: 'HTML'
              })
          });
      } catch (err) {
          console.error("Telegram API error:", err);
      }
  } else {
      console.warn("Telegram bot token or chat ID is not set in Admin Panel.");
  }
  
  alert("✅ Buyurtmangiz muvaffaqiyatli qabul qilindi!");
  localStorage.removeItem("cart");
  window.location.href = "index.html";
});
</script>

</body>
</html>
