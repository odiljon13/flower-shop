<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Shop.co</title>
    <link rel="icon" href="img/logo.jpg">
    <script>
        // Protect admin panel
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="bg-white shadow-md p-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="img/logo.jpg" alt="Logo" class="w-10 h-10 rounded-full shadow-sm object-cover">
            <h1 class="text-2xl font-bold text-gray-800">Admin Panel</h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="index.html" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-medium transition shadow">🏪 Do'konni ko'rish</a>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-medium transition shadow">🚪 Chiqish</button>
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto p-6 mt-6">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Add / Edit Form -->
        <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-md h-fit">
            <h2 id="form-title" class="text-xl font-bold mb-4 text-gray-800">Yangi gul qo'shish</h2>
            <form id="product-form" class="space-y-4">
                <input type="hidden" id="product-id">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Gul nomi</label>
                    <input type="text" id="name" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-pink-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Narxi ($)</label>
                        <input type="number" id="price" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-pink-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Eski narxi ($)</label>
                        <input type="number" id="originalPrice" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-pink-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Kategoriya</label>
                    <select id="category" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-pink-500 outline-none">
                        <option value="roses">Roses</option>
                        <option value="bouquet">Bouquet</option>
                        <option value="lilies">Lilies</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Rasm havolasi (URL yoki path)</label>
                    <input type="text" id="img" value="img/logo.jpg" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-pink-500 outline-none">
                </div>

                <div class="flex items-center gap-2 mt-2">
                    <input type="checkbox" id="onSale" class="w-4 h-4 text-pink-500 focus:ring-pink-500 border-gray-300 rounded">
                    <label for="onSale" class="text-sm font-medium text-gray-700">Chegirmada (On Sale)</label>
                </div>

                <div class="pt-4 flex gap-2">
                    <button type="submit" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg transition shadow">Saqlash</button>
                    <button type="button" onclick="resetForm()" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-lg transition shadow">Bekor qilish</button>
                </div>
            </form>
        </div>

        <!-- Products List -->
        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Barcha gullar</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-700 text-sm">
                            <th class="p-3 rounded-tl-lg">Rasm</th>
                            <th class="p-3">Nomi</th>
                            <th class="p-3">Narxi</th>
                            <th class="p-3">Kategoriya</th>
                            <th class="p-3 text-center">Chegirma</th>
                            <th class="p-3 rounded-tr-lg text-right">Harakatlar</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody" class="divide-y divide-gray-200">
                        <!-- Rendered by JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</main>

<script>
    function logout() {
        localStorage.removeItem('isLoggedIn');
        window.location.href = 'login.html';
    }

    let products = JSON.parse(localStorage.getItem('products')) || [];
    const tbody = document.getElementById('products-tbody');
    const form = document.getElementById('product-form');
    const formTitle = document.getElementById('form-title');

    function renderTable() {
        tbody.innerHTML = '';
        products.forEach(p => {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-gray-50 transition';
            tr.innerHTML = `
                <td class="p-3">
                    <img src="${p.img}" class="w-12 h-12 rounded object-cover border" onerror="this.src='img/logo.jpg'">
                </td>
                <td class="p-3 font-medium text-gray-800">${p.name}</td>
                <td class="p-3">
                    $${p.price}
                    ${p.originalPrice ? `<span class="text-xs text-gray-400 line-through ml-1">$${p.originalPrice}</span>` : ''}
                </td>
                <td class="p-3 text-sm text-gray-600 capitalize">${p.category}</td>
                <td class="p-3 text-center">
                    ${p.onSale ? '<span class="bg-green-100 text-green-700 px-2 py-1 rounded-full text-xs font-bold">Ha</span>' : '<span class="bg-gray-100 text-gray-500 px-2 py-1 rounded-full text-xs font-bold">Yo\'q</span>'}
                </td>
                <td class="p-3 text-right space-x-2">
                    <button onclick="editProduct(${p.id})" class="text-blue-500 hover:text-blue-700 font-medium text-sm bg-blue-50 px-2 py-1 rounded">Tahrirlash</button>
                    <button onclick="deleteProduct(${p.id})" class="text-red-500 hover:text-red-700 font-medium text-sm bg-red-50 px-2 py-1 rounded">O'chirish</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const id = document.getElementById('product-id').value;
        const name = document.getElementById('name').value;
        const price = parseFloat(document.getElementById('price').value);
        const originalPrice = document.getElementById('originalPrice').value ? parseFloat(document.getElementById('originalPrice').value) : null;
        const category = document.getElementById('category').value;
        const img = document.getElementById('img').value;
        const onSale = document.getElementById('onSale').checked;

        if (id) {
            // Edit existing
            const index = products.findIndex(p => p.id == id);
            if (index !== -1) {
                products[index] = { id: parseInt(id), name, price, originalPrice, category, img, onSale };
            }
        } else {
            // Add new
            const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
            products.push({ id: newId, name, price, originalPrice, category, img, onSale });
        }

        saveAndRender();
        resetForm();
    });

    function editProduct(id) {
        const product = products.find(p => p.id === id);
        if (!product) return;

        document.getElementById('product-id').value = product.id;
        document.getElementById('name').value = product.name;
        document.getElementById('price').value = product.price;
        document.getElementById('originalPrice').value = product.originalPrice || '';
        document.getElementById('category').value = product.category;
        document.getElementById('img').value = product.img;
        document.getElementById('onSale').checked = product.onSale;

        formTitle.textContent = "Gulni tahrirlash";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteProduct(id) {
        if (confirm("Rostdan ham bu gulni o'chirmoqchimisiz?")) {
            products = products.filter(p => p.id !== id);
            saveAndRender();
        }
    }

    function resetForm() {
        form.reset();
        document.getElementById('product-id').value = '';
        formTitle.textContent = "Yangi gul qo'shish";
    }

    function saveAndRender() {
        localStorage.setItem('products', JSON.stringify(products));
        renderTable();
    }

    // Initialize
    renderTable();

</script>
</body>
</html>
