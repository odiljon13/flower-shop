<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Bosh sahifa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .message {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: fadeIn 0.5s ease-out;
            max-width: 500px;
            width: 90%;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        h2 {
            margin-bottom: 1rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            margin-bottom: 1.5rem;
        }

        .btn-logout {
            padding: 12px 24px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            border-radius: 12px;
            color: #ef4444;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: #ef4444;
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>
    <div class="message" id="msg-container">
        <!-- Content will be injected by JS -->
    </div>

    <script>
        // Check if logged in
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        const msgContainer = document.getElementById('msg-container');

        if (isLoggedIn === 'true') {
            msgContainer.innerHTML = `
                <h2>Xush kelibsiz, Madina!</h2>
                <p>Admin Panelga muvaffaqiyatli kirdingiz.</p>
                <button class="btn-logout" onclick="logout()">Chiqish</button>
            `;
        } else {
            msgContainer.innerHTML = `
                <h2 style="-webkit-text-fill-color: #ef4444;">Xatolik!</h2>
                <p>Siz ro'yxatdan o'tishingiz kerak!</p>
                <p style="font-size: 0.8rem;">Hozir login sahifasiga yo'naltirilasiz...</p>
            `;
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2500);
        }

        function logout() {
            localStorage.removeItem('isLoggedIn');
            window.location.reload();
        }
    </script>
</body>
</html>
